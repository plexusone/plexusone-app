name: Desktop CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop.yaml'

jobs:
  swift-ci:
    name: Swift CI
    uses: plexusone/.github/.github/workflows/swift-ci.yaml@main
    with:
      working-directory: apps/desktop
      # Same runner and Xcode as desktop-release.yaml, so CI tests what
      # the release builds with.
      macos-version: macos-26
      xcode-version: latest-stable
