site_name: PlexusOne Apps
site_description: Multi-agent orchestration platform for AI CLI tools
site_url: https://plexusone.github.io/plexusone-app/

repo_name: plexusone/plexusone-app
repo_url: https://github.com/plexusone/plexusone-app

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    # Dark mode first (PlexusOne default)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:
  - https://plexusone.dev/css/plexusone-mkdocs.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guides:
    - Getting Started:
      - Installation: guides/getting-started/installation.md
      - Quick Start: guides/getting-started/quickstart.md
      - Requirements: guides/getting-started/requirements.md
    - Desktop App:
      - Overview: guides/desktop/overview.md
      - Grid Layout: guides/desktop/grid-layout.md
      - Session Management: guides/desktop/sessions.md
      - Multi-Window: guides/desktop/multi-window.md
      - Claude Sessions: guides/desktop/claude-sessions.md
      - Keyboard Shortcuts: guides/desktop/shortcuts.md
    - Mobile Apps:
      - Overview: guides/mobile/overview.md
      - Connecting: guides/mobile/connecting.md
    - Reference:
      - Configuration: guides/reference/configuration.md
      - WebSocket Protocol: guides/reference/protocol.md
    - Development:
      - Desktop App: guides/development/desktop.md
      - Flutter App: guides/development/flutter.md
      - Native iOS App: guides/development/ios.md
      - Contributing: guides/development/contributing.md
      - Maintaining: guides/development/maintaining.md
  - Design:
    - Architecture: design/architecture/overview.md
    - Decision Records:
      - Overview: design/adrs/index.md
      - "0001 Session End Detection": design/adrs/0001-claude-session-end-detection.md
      - "0002 tmux Mouse Mode": design/adrs/0002-tmux-mouse-mode-for-scrolling.md
  - Specs:
    - Overview: specs/index.md
    - PRD: specs/PRD.md
    - TRD: specs/TRD.md
  - Releases:
    - Changelog: releases/changelog.md
    - v0.6.0: releases/v0.6.0.md
    - v0.5.2: releases/v0.5.2.md
    - v0.5.1: releases/v0.5.1.md
    - v0.5.0: releases/v0.5.0.md
    - v0.4.1: releases/v0.4.1.md
    - v0.4.0: releases/v0.4.0.md
    - v0.3.0: releases/v0.3.0.md
    - v0.2.0: releases/v0.2.0.md
    - v0.1.0: releases/v0.1.0.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/plexusone/plexusone-app

copyright: Copyright &copy; 2024 PlexusOne
